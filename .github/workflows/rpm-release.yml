name: Build RPM (Fedora & RHEL) and Release

on:
  push:
    branches: [ wip-ci ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to use for the release (if using manual dispatch)'
        required: false


env:
  CARGO_TERM_COLOR: always

jobs:
  build-rpm:
    name: RPM (${{ matrix.distro }}-${{ matrix.version }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fedora
          - distro: fedora
            image: fedora
            version: 44
            arch: amd64
            runner: ubuntu-24.04
          - distro: fedora
            image: fedora
            version: 44
            arch: arm64
            runner: ubuntu-24.04-arm
          - distro: fedora
            image: fedora
            version: 43
            arch: amd64
            runner: ubuntu-24.04
          - distro: fedora
            image: fedora
            version: 43
            arch: arm64
            runner: ubuntu-24.04-arm
          - distro: fedora
            image: fedora
            version: 42
            arch: amd64
            runner: ubuntu-24.04
          - distro: fedora
            image: fedora
            version: 42
            arch: arm64
            runner: ubuntu-24.04-arm
          # RHEL-compatible rebuilds (Rocky Linux mirrors RHEL 9/10)
          # NB: Rocky images live under the rockylinux/rockylinux namespace
          - distro: rockylinux
            image: rockylinux/rockylinux
            version: 10
            arch: amd64
            runner: ubuntu-24.04
          - distro: rockylinux
            image: rockylinux/rockylinux
            version: 10
            arch: arm64
            runner: ubuntu-24.04-arm
          - distro: rockylinux
            image: rockylinux/rockylinux
            version: 9
            arch: amd64
            runner: ubuntu-24.04
          - distro: rockylinux
            image: rockylinux/rockylinux
            version: 9
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build RPM inside container
        run: |
          docker run --rm \
            --platform linux/${{ matrix.arch }} \
            -v "$PWD":/work:rw \
            -w /work \
            ${{ matrix.image }}:${{ matrix.version }} \
            bash -euxc '
              dnf -y install --setopt=install_weak_deps=False \
                rpm-build cargo rustc openssl-devel pam-devel pkgconfig \
                openssh-clients make gcc diffutils tar gzip clang-devel
              bash /work/packaging/rpm/build.sh
              cd rpm-artifacts
              find . -type f -name "*.rpm" -exec mv {} ${{ matrix.distro }}-{} \;
            '

      - name: List RPM artifacts
        run: ls -lh rpm-artifacts/

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-packages-${{ matrix.distro }}-${{ matrix.version }}-${{ matrix.arch }}
          path: rpm-artifacts/
          if-no-files-found: error

  release:
    name: Create GitHub Release and upload RPMs
    runs-on: ubuntu-latest
    needs: build-rpm
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all RPM artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded
          pattern: rpm-packages-*
          merge-multiple: true

      - name: Create release and upload .rpm assets
        uses: softprops/action-gh-release@v1
        with:
          files: downloaded/**/*.rpm
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: Automated .rpm builds for Fedora (42/43/44) and RHEL-compatible Rocky Linux (9/10)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
